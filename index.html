<!DOCTYPE html>
<html>
<head>
  <title>Мой GPT</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .msg { margin-bottom: 10px; }
    .user { color: blue; }
    .bot { color: green; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>Базовый GPT интерфейс</h2>
  <div>
    <label>API ключ:</label><br>
    <input type="password" id="apiKey" placeholder="sk-...">
    <button onclick="saveKey()">Сохранить ключ</button>
  </div>
  <hr>
  <div id="chat"></div>
  <textarea id="userInput" placeholder="Введи сообщение..." rows="3"></textarea>
  <button onclick="sendMessage()">Отправить</button>

  <script>
    let apiKey = localStorage.getItem('openai_key') || '';

    function saveKey() {
      apiKey = document.getElementById('apiKey').value;
      localStorage.setItem('openai_key', apiKey);
      alert('Ключ сохранён');
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg) return;
      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="msg user"><strong>Ты:</strong> ${msg}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: 'gpt-6-astra', // или 'gpt-4o'
          messages: [{ role: 'user', content: msg }],
          temperature: 0.7
        })
      });
      const data = await response.json();
      if (data.choices && data.choices.length > 0) {
        const botMsg = data.choices[0].message.content;
        chat.innerHTML += `<div class="msg bot"><strong>GPT:</strong> ${botMsg}</div>`;
      } else {
        chat.innerHTML += `<div class="msg bot"><strong>Ошибка:</strong> ${JSON.stringify(data)}</div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
